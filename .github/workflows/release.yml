# 推一个 v* 的 tag → 跑测试 → 打 exe + 安装程序 → 发到 GitHub Releases。
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# 别的电脑上直接下载最新版：
#   https://github.com/Teneeduu/jo-app/releases/latest/download/jo-app-setup.exe
#
# 手动触发（Actions 页面 → release → Run workflow）只打包、不发布，
# 安装程序在这次运行的 Artifacts 里。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
  INNO_DIR: C:\InnoSetup7

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: python -m pip install -r requirements.txt pytest

      - name: 跑测试
        run: python -m pytest -q

      - name: 检查 tag 和代码里的版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (python -c "import joapp; print(joapp.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} 和 joapp/__init__.py 里的版本 $v 对不上"
          }

      - name: 装 Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $env:INNO_URL -OutFile $installer
          $p = Start-Process $installer -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:INNO_DIR"
          if ($p.ExitCode) { throw "Inno Setup 安装失败：$($p.ExitCode)" }
          if (-not (Test-Path "$env:INNO_DIR\ISCC.exe")) { throw "没找到 ISCC.exe" }

      - name: 打包
        shell: pwsh
        run: ./scripts/build.ps1 -Python python -Iscc "$env:INNO_DIR\ISCC.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: jo-app-setup
          path: dist/jo-app-setup.exe

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @(
            '## Install'
            ''
            'Download **jo-app-setup.exe** below and run it. No admin rights and no Python needed.'
            ''
            '- Windows SmartScreen may say "Windows protected your PC" (the installer is not code-signed): click **More info** → **Run anyway**.'
            '- You can tick **Start with Windows** during setup.'
            '- Upgrading: just install the new version over the old one. Your tasks and rewards stay (data lives in `%APPDATA%\jo-app`).'
            ''
            '## 下载安装'
            ''
            '下载 **jo-app-setup.exe** 双击安装，不需要管理员权限，也不需要装 Python。界面支持中文 / English 切换。'
            'Windows 提示「已保护你的电脑」时点「更多信息」→「仍要运行」。升级直接覆盖安装，数据都在。'
          ) -join "`n"
          gh release create "${{ github.ref_name }}" dist/jo-app-setup.exe `
            --title "jo-app ${{ github.ref_name }}" --notes $notes
